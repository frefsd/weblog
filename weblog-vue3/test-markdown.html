<!DOCTYPE html>
<html>

<head>
    <title>Markdown 转换测试</title>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .original {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .rendered {
            background: #e8f5e8;
            padding: 15px;
            border-radius: 5px;
        }

        h1 {
            color: #333;
        }

        pre {
            background: #2d2d2d;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background: #f2f2f2;
        }
    </style>
</head>

<body>
    <h1>Markdown 转换测试</h1>

    <div class="original">
        <h2>原始 Markdown 内容：</h2>
        <pre id="original-markdown"></pre>
    </div>

    <div class="rendered">
        <h2>转换后的 HTML：</h2>
        <div id="rendered-html"></div>
    </div>

    <script>

        // 显示原始 Markdown
        document.getElementById('original-markdown').textContent = markdownContent;

        // 创建 Markdown 解析器（使用与 Vue 组件相同的配置）
        const md = window.markdownit({
            html: true,
            linkify: true,
            typographer: true,
            breaks: true
        });

        // 转换并显示 HTML
        const html = md.render(markdownContent);
        document.getElementById('rendered-html').innerHTML = html;

        console.log('转换成功！');
        console.log('原始 Markdown 长度:', markdownContent.length);
        console.log('生成 HTML 长度:', html.length);
    </script>
</body>

</html>
